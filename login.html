<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 更番表同步工具</title>
  <style>
    body { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; background: #f5f7fb; margin: 0; color: #1f2937; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08); width: 100%; max-width: 420px; }
    h1 { margin-top: 0; font-size: 22px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; border-radius: 8px; border: 1px solid #cbd5f5; padding: 10px 12px; box-sizing: border-box; }
    button { margin-top: 16px; width: 100%; background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    .error { margin-top: 12px; color: #b91c1c; }
    .muted { color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>更番表同步工具登录</h1>
    <p class="muted">默认密码：admin123，可在后台设置中修改。</p>
    <form method="post" action="/auth.php">
      <label for="password">管理员密码</label>
      <input type="password" id="password" name="password" required>
      <button type="submit">登录</button>
    </form>
    <div class="error" id="error" style="display:none;">密码错误，请重试。</div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === '1') {
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
