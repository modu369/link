<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置 - 更番表同步工具</title>
  <style>
    body { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; background: #f5f7fb; margin: 0; color: #1f2937; }
    header { background: #111827; color: #fff; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 30px 60px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08); }
    h2 { margin-top: 0; font-size: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], input[type="password"], textarea { width: 100%; border-radius: 8px; border: 1px solid #cbd5f5; padding: 10px 12px; box-sizing: border-box; }
    textarea { min-height: 160px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    .btn-secondary { background: #64748b; }
    .btn + .btn { margin-left: 8px; }
    .message { background: #ecfeff; border: 1px solid #a5f3fc; color: #0e7490; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; white-space: pre-line; }
    .error { background: #fee2e2; border-color: #fecaca; color: #991b1b; }
    .muted { color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
<header>
  <div>
    <h1>更番表同步工具</h1>
    <p class="muted">后台设置</p>
  </div>
  <div>
    <a class="btn btn-secondary" href="/console.html">控制台</a>
    <a class="btn btn-secondary" href="/logout.php">退出登录</a>
  </div>
</header>
<main>
  <div class="card">
    <h2>数据库配置</h2>
    <table>
      <thead>
        <tr>
          <th>名称</th>
          <th>Host</th>
          <th>Port</th>
          <th>数据库</th>
          <th>用户名</th>
          <th>密码</th>
        </tr>
      </thead>
      <tbody id="db-table"></tbody>
    </table>
    <button class="btn btn-secondary" id="add-db-row">新增一行</button>
    <button class="btn" id="save-db">保存数据库配置</button>
    <div class="message" id="message-db"></div>
    <p class="muted">留空可删除数据库配置。支持同时配置多个苹果CMS数据库。</p>
  </div>

  <div class="card">
    <h2>完结关键字</h2>
    <label for="cleanup-keywords">使用英文逗号分隔</label>
    <input type="text" id="cleanup-keywords">
    <button class="btn" id="save-cleanup">保存完结关键字</button>
    <div class="message" id="message-cleanup"></div>
  </div>

  <div class="card">
    <h2>代理设置（可选）</h2>
    <div class="grid grid-2">
      <div>
        <label for="proxy-host">代理IP</label>
        <input type="text" id="proxy-host" placeholder="例如 127.0.0.1">
      </div>
      <div>
        <label for="proxy-port">代理端口</label>
        <input type="text" id="proxy-port" placeholder="例如 7890">
      </div>
      <div>
        <label for="proxy-user">代理账号</label>
        <input type="text" id="proxy-user" placeholder="可选">
      </div>
      <div>
        <label for="proxy-pass">代理密码</label>
        <input type="password" id="proxy-pass" placeholder="可选">
      </div>
    </div>
    <button class="btn" id="save-proxy">保存代理设置</button>
    <div class="message" id="message-proxy"></div>
  </div>

  <div class="card">
    <h2>手动更番表 HTML</h2>
    <label for="manual-html">粘贴 https://www.comicat.org/ 更番表区域的 HTML</label>
    <textarea id="manual-html" placeholder="如果填写，将优先使用这里的 HTML 进行解析。"></textarea>
    <div>
      <button class="btn" id="save-manual">保存手动HTML</button>
      <button class="btn btn-secondary" id="parse-manual">从粘贴的HTML提取更番信息</button>
    </div>
    <div class="message" id="message-manual"></div>
  </div>

  <div class="card">
    <h2>管理员密码</h2>
    <label for="admin-password">留空则不修改密码</label>
    <input type="password" id="admin-password" placeholder="可选">
    <button class="btn" id="save-password">保存管理员密码</button>
    <div class="message" id="message-password"></div>
  </div>

  <div class="card">
    <h2>同义词替换（<span id="replacements-count">0</span> 条）</h2>
    <label for="replacements-text">格式：原文=替换为（每行一条）</label>
    <textarea id="replacements-text"></textarea>
    <button class="btn" id="save-replacements">保存同义词替换</button>
    <div class="message" id="message-replacements"></div>
  </div>
</main>
<script>
  const replacementsCount = document.getElementById('replacements-count');
  const dbTable = document.getElementById('db-table');

  function showMessage(elementId, text, isError = false) {
    const messageBox = document.getElementById(elementId);
    messageBox.textContent = text;
    messageBox.classList.toggle('error', isError);
    messageBox.style.display = 'block';
    setTimeout(() => {
      messageBox.style.display = 'none';
    }, 4000);
  }

  function createDbRow(db = {}) {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><input type="text" class="db-label" value="${db.label || ''}"></td>
      <td><input type="text" class="db-host" value="${db.host || 'localhost'}"></td>
      <td><input type="text" class="db-port" value="${db.port || '3306'}"></td>
      <td><input type="text" class="db-name" value="${db.name || ''}"></td>
      <td><input type="text" class="db-user" value="${db.user || ''}"></td>
      <td><input type="password" class="db-pass" value="${db.pass || ''}"></td>
    `;
    dbTable.appendChild(row);
  }

  function collectDbRows() {
    const rows = Array.from(dbTable.querySelectorAll('tr'));
    return rows.map(row => ({
      label: row.querySelector('.db-label').value,
      host: row.querySelector('.db-host').value,
      port: row.querySelector('.db-port').value,
      name: row.querySelector('.db-name').value,
      user: row.querySelector('.db-user').value,
      pass: row.querySelector('.db-pass').value,
    }));
  }

  async function loadState() {
    const res = await fetch('/api.php?action=state');
    if (!res.ok) {
      if (res.status === 401) {
        window.location.href = '/portal.html';
      }
      return;
    }
    const data = await res.json();
    replacementsCount.textContent = data.replacements_count || 0;

    dbTable.innerHTML = '';
    if (data.settings.dbs.length === 0) {
      createDbRow();
    } else {
      data.settings.dbs.forEach(db => createDbRow(db));
      createDbRow();
    }

    document.getElementById('cleanup-keywords').value = data.settings.cleanup_keywords.join(',');
    document.getElementById('proxy-host').value = data.settings.proxy_host || '';
    document.getElementById('proxy-port').value = data.settings.proxy_port || '';
    document.getElementById('proxy-user').value = data.settings.proxy_user || '';
    document.getElementById('proxy-pass').value = data.settings.proxy_pass || '';
    document.getElementById('manual-html').value = data.settings.manual_schedule_html || '';
    document.getElementById('replacements-text').value = data.settings.replacements_text;
  }

  async function postAction(action, payload = null) {
    const res = await fetch(`/api.php?action=${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: payload ? JSON.stringify(payload) : null,
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || '操作失败');
    }
    return data;
  }

  function buildPayload() {
    return {
      dbs: collectDbRows(),
      cleanup_keywords: document.getElementById('cleanup-keywords').value.split(',').map(item => item.trim()).filter(Boolean),
      proxy_host: document.getElementById('proxy-host').value,
      proxy_port: document.getElementById('proxy-port').value,
      proxy_user: document.getElementById('proxy-user').value,
      proxy_pass: document.getElementById('proxy-pass').value,
      manual_schedule_html: document.getElementById('manual-html').value,
      replacements_text: document.getElementById('replacements-text').value,
      admin_password: document.getElementById('admin-password').value,
    };
  }

  async function saveSettings(messageId, message) {
    try {
      const data = await postAction('save_settings', buildPayload());
      showMessage(messageId, message || data.message || '设置已保存。');
      document.getElementById('admin-password').value = '';
      await loadState();
    } catch (err) {
      showMessage(messageId, err.message, true);
    }
  }

  document.getElementById('save-db').addEventListener('click', () => saveSettings('message-db', '数据库配置已保存。'));
  document.getElementById('save-cleanup').addEventListener('click', () => saveSettings('message-cleanup', '完结关键字已保存。'));
  document.getElementById('save-proxy').addEventListener('click', () => saveSettings('message-proxy', '代理设置已保存。'));
  document.getElementById('save-manual').addEventListener('click', () => saveSettings('message-manual', '手动HTML已保存。'));
  document.getElementById('save-password').addEventListener('click', () => saveSettings('message-password', '管理员密码已保存。'));
  document.getElementById('save-replacements').addEventListener('click', () => saveSettings('message-replacements', '同义词替换已保存。'));

  document.getElementById('parse-manual').addEventListener('click', async () => {
    try {
      const manualHtml = document.getElementById('manual-html').value;
      const data = await postAction('parse_manual_html', { manual_schedule_html: manualHtml });
      showMessage('message-manual', (data.message || '已从手动HTML提取更番信息。') + `（${data.count || 0} 条）`);
    } catch (err) {
      showMessage('message-manual', err.message, true);
    }
  });

  document.getElementById('add-db-row').addEventListener('click', () => {
    createDbRow();
  });

  loadState();
</script>
</body>
</html>
